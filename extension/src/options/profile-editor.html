<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Profile Editor</title>
  <style>
    body { font-family: system-ui, Arial; margin: 20px; }
    label { display:block; margin-top:10px; font-weight:600 }
    input, textarea { width:100%; padding:8px; margin-top:6px; box-sizing:border-box }
    .row { display:flex; gap:10px }
    .col { flex:1 }
    .actions { margin-top:16px }
    pre { background:#f6f8fa; padding:12px; overflow:auto }
    .section { border:1px solid #e6eef2; padding:12px; border-radius:8px; margin-bottom:12px }
  </style>
</head>
<body>
  <h1>Profile Editor</h1>
  <div class="section">
    <label>Upload resume (PDF or text)</label>
    <input id="resumeFile" type="file" accept=".pdf,.txt,.md,.html,.htm,.docx,.rtf,.json" />
    <div class="row actions">
      <button id="analyzeBtn">Analyze & Generate Profile</button>
      <button id="loadStoredBtn">Load Stored Profile</button>
    </div>
    <div id="analyzeStatus" style="margin-top:8px;color:#2b6cb0"></div>
  </div>

  <div>
    <label>Full name</label>
    <input id="full_name" />
    <div class="row">
      <div class="col">
        <label>First name</label>
        <input id="first_name" />
      </div>
      <div class="col">
        <label>Last name</label>
        <input id="last_name" />
      </div>
    </div>
    <label>Email</label>
    <input id="email" />
    <label>Phone</label>
    <input id="phone" />
    <label>LinkedIn</label>
    <input id="linkedin" />
    <label>GitHub</label>
    <input id="github" />

    <h2>Education</h2>
    <div id="educationList"></div>
    <button id="addEducation">Add education</button>

    <h2>Experience</h2>
    <div id="experienceList"></div>
    <button id="addExperience">Add experience</button>

    <h2>Projects</h2>
    <div id="projectsList"></div>
    <button id="addProject">Add project</button>

    <div class="actions">
      <button id="saveBtn">Save profile</button>
      <button id="downloadBtn">Download JSON</button>
    </div>

    <h3>Raw preview</h3>
    <pre id="rawPreview">(not loaded)</pre>
  </div>

  <script src="../shared/storage.js"></script>
  <script src="../shared/aiClient.js"></script>
  <script src="../shared/resumeParser.js"></script>
  <script src="profile-editor.js"></script>
</body>
</html>
