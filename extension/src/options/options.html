<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Knowledge Base Settings</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, sans-serif;
        margin: 0;
        padding: 24px;
        background: #f7faf7;
        color: #1f2a1f;
      }

      main {
        max-width: 680px;
        margin: 0 auto;
        background: #fff;
        border: 1px solid #d9e4d9;
        border-radius: 14px;
        padding: 20px;
      }

      h1 {
        margin-top: 0;
      }

      .row {
        display: grid;
        grid-template-columns: 180px 1fr;
        gap: 10px;
        margin: 10px 0;
        align-items: center;
      }

      label {
        font-weight: 600;
      }

      input {
        padding: 8px;
        border-radius: 8px;
        border: 1px solid #cfdacb;
      }

      button {
        margin-top: 14px;
        border: 1px solid #2d6a4f;
        background: #d8f3dc;
        border-radius: 8px;
        padding: 8px 12px;
        font-weight: 600;
        cursor: pointer;
      }

      #status {
        margin-top: 10px;
        color: #4b5d4b;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Knowledge Base</h1>
      <p>Edit your reusable profile fields for auto-fill.</p>

      <form id="kbForm">
        <div class="row">
          <label for="full_name">Full Name</label>
          <input id="full_name" name="full_name" type="text" />
        </div>

        <div class="row">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" />
        </div>

        <div class="row">
          <label for="phone">Phone</label>
          <input id="phone" name="phone" type="text" />
        </div>

        <div class="row">
          <label for="city">City</label>
          <input id="city" name="city" type="text" />
        </div>

        <div class="row">
          <label for="linkedin">LinkedIn URL</label>
          <input id="linkedin" name="linkedin" type="url" />
        </div>

        <div class="row">
          <label for="github">GitHub URL</label>
          <input id="github" name="github" type="url" />
        </div>

        <button type="submit">Save</button>
      </form>

      <p id="status">Ready.</p>
    </main>

    <script src="../shared/storage.js"></script>
    <script src="options.js"></script>
  </body>
</html>
